<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مانی ایرانی</title>

<!-- PWA: install like an app on Android / iPhone -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="مانی ایرانی">

<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a1826;
    --bg-deep-2:#0d2035;
    --panel:rgba(18,38,58,0.72);
    --panel-solid:#122436;
    --panel-light:rgba(255,255,255,0.05);
    --turquoise:#2ec4b6;
    --turquoise-dark:#1a8f84;
    --gold:#d4af37;
    --gold-soft:#f0d99a;
    --cream:#f3efe4;
    --muted:#8fa6bb;
    --danger:#e0685f;
    --border:rgba(212,175,55,0.22);
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:var(--bg-deep);
    color:var(--cream);
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      radial-gradient(circle at 50% 50%, transparent 0 8px, rgba(212,175,55,0.055) 8.5px 9px, transparent 9.5px),
      linear-gradient(180deg, var(--bg-deep-2), var(--bg-deep) 60%);
    background-size:64px 64px, 100% 100%;
  }
  #site-bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    transition:background 0.6s ease;
  }
  #site-bg-layer::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,24,38,0.55), rgba(10,24,38,0.86));
  }
  #starfield{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-star{
    position:absolute;
    border-radius:50%;
    background:var(--gold-soft);
    box-shadow:0 0 6px 1px rgba(240,217,154,0.6);
    animation:bgTwinkle ease-in-out infinite;
  }
  @keyframes bgTwinkle{
    0%,100%{opacity:0.1; transform:scale(0.7);}
    50%{opacity:0.85; transform:scale(1.25);}
  }
  #app{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  ::selection{background:var(--gold); color:#12253a;}

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.35); border-radius:10px;}

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    background:linear-gradient(180deg, rgba(10,20,32,0.9), rgba(10,20,32,0.55));
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:50;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, var(--gold-soft), var(--gold) 55%, var(--turquoise));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }
  .brand-star{width:26px;height:26px;flex-shrink:0;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn{
    border:1px solid var(--border);
    background:var(--panel-light);
    color:var(--cream);
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    transition:all .2s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.12); transform:translateY(-1px);}
  .btn-gold{
    background:linear-gradient(90deg, var(--gold), var(--gold-soft));
    color:#1a2b3d;
    border:none;
    font-weight:700;
  }
  .btn-gold:hover{box-shadow:0 4px 18px rgba(212,175,55,0.35); transform:translateY(-1px);}
  .btn-turquoise{
    background:linear-gradient(90deg, var(--turquoise-dark), var(--turquoise));
    color:#062621;
    border:none;
    font-weight:700;
  }
  .btn-ghost{background:transparent; border:1px solid var(--border);}
  .btn-danger{background:rgba(224,104,95,0.12); border:1px solid rgba(224,104,95,0.4); color:#f4a49d;}
  .btn-danger:hover{border-color:var(--danger); box-shadow:0 0 0 3px rgba(224,104,95,0.14);}
  .btn-sm{padding:6px 12px; font-size:13px; border-radius:8px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}

  .sync-dot{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(255,255,255,0.04);
  }
  .sync-online{background:#3ddc97; box-shadow:0 0 8px 1px rgba(61,220,151,0.6);}
  .sync-connecting{background:#e0c96a; animation:bgTwinkle 1s ease-in-out infinite;}
  .sync-offline{background:#e0685f;}
  .brand-pulse{animation:brandPulse 3s ease-in-out infinite;}
  @keyframes brandPulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(212,175,55,0));}
    50%{filter:drop-shadow(0 0 8px rgba(212,175,55,0.55));}
  }

  .hero-strip{
    display:flex; align-items:center; gap:16px;
    padding:20px 24px; margin-bottom:24px;
    background:linear-gradient(120deg, rgba(212,175,55,0.14), rgba(46,196,182,0.08));
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .hero-star{width:40px;height:40px; color:var(--gold); flex-shrink:0; animation:brandPulse 3s ease-in-out infinite;}
  .hero-title{font-weight:800; font-size:17px; color:var(--cream);}
  .hero-sub{font-size:13.5px; color:var(--muted); margin-top:4px;}
  .hero-sub b{color:var(--gold-soft); font-size:15px;}

  .post-img-wrap{overflow:hidden;}
  .post-img-wrap img{transition:transform .5s ease;}
  .post-card:hover .post-img-wrap img{transform:scale(1.06);}
    display:flex; align-items:center; gap:6px;
    background:rgba(212,175,55,0.12);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:999px;
    font-weight:700;
    color:var(--gold-soft);
    font-size:14px;
  }
  .star-badge svg{width:16px;height:16px;}

  /* ---------- generic layout ---------- */
  .main{flex:1; width:100%; max-width:1100px; margin:0 auto; padding:32px 20px 80px; animation:pageFade .45s ease both;}
  @keyframes pageFade{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .center-screen{flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;}

  .glass-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }

  /* ---------- loading ---------- */
  .loader-wrap{display:flex; flex-direction:column; align-items:center; gap:18px; color:var(--muted);}
  .loader-star{width:54px;height:54px; animation:spin 1.6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- auth ---------- */
  .auth-card{width:100%; max-width:400px; padding:36px 30px; position:relative; overflow:hidden;}
  .auth-title{font-size:26px; font-weight:800; margin:0 0 4px; text-align:center; color:var(--cream);}
  .auth-sub{color:var(--muted); text-align:center; font-size:14px; margin:0 0 26px;}
  .tabs{display:flex; background:rgba(255,255,255,0.04); border-radius:999px; padding:4px; margin-bottom:24px; border:1px solid var(--border);}
  .tab-btn{flex:1; padding:10px 0; border:none; background:transparent; color:var(--muted); border-radius:999px; font-weight:700; font-size:14px; transition:all .2s ease;}
  .tab-btn.active{background:linear-gradient(90deg, var(--gold), var(--gold-soft)); color:#1a2b3d;}
  .field{margin-bottom:16px; display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:13px; color:var(--muted); font-weight:600;}
  .field input, .field textarea{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--cream);
    padding:12px 14px;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus, .field textarea:focus{border-color:var(--turquoise); box-shadow:0 0 0 3px rgba(46,196,182,0.15);}
  .field input::placeholder, .field textarea::placeholder{color:rgba(143,166,187,0.6);}
  .auth-error{
    color:#f4a49d;
    background:rgba(224,104,95,0.1);
    border:1px solid rgba(224,104,95,0.35);
    padding:10px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:14px;
    text-align:center;
  }
  .full-btn{width:100%; justify-content:center; padding:13px 0; font-size:15px;}
  .twinkle{position:absolute; border-radius:50%; background:var(--gold-soft); opacity:0.7; animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0.15; transform:scale(0.8);} 50%{opacity:0.9; transform:scale(1.2);}}

  /* ---------- channel banner ---------- */
  .channel-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 22px; margin-bottom:28px; flex-wrap:wrap;
    background:linear-gradient(90deg, rgba(46,196,182,0.12), rgba(212,175,55,0.1));
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .channel-text{font-size:15px; font-weight:600; color:var(--cream); line-height:1.7;}

  /* ---------- posts feed ---------- */
  .section-title{display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; margin:0 0 20px; color:var(--gold-soft);}
  .section-title svg{width:20px;height:20px;}
  .posts-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:22px;}
  .post-card{
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    transition:transform .25s ease, box-shadow .25s ease;
    animation:fadeUp .5s ease both;
  }
  .post-card:hover{transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.4);}
  .post-img-wrap{width:100%; aspect-ratio:4/3; border-bottom:1px solid var(--border);}
  .post-card img{width:100%; height:100%; aspect-ratio:4/3; object-fit:cover; display:block;}
  .post-caption{padding:14px 16px; font-size:14.5px; color:var(--cream); line-height:1.8; min-height:20px;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
    border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state svg{width:44px; height:44px; margin-bottom:12px; opacity:0.6;}

  /* ---------- dashboard ---------- */
  .dash-layout{display:flex; gap:24px; align-items:flex-start;}
  .dash-tabs{
    display:flex; flex-direction:column; gap:6px;
    min-width:190px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:10px;
    position:sticky; top:92px;
  }
  .dash-tab{
    text-align:right; padding:12px 14px; border-radius:10px; border:none; background:transparent;
    color:var(--muted); font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:10px;
    transition:all .2s ease;
  }
  .dash-tab svg{width:18px;height:18px; flex-shrink:0;}
  .dash-tab:hover{background:rgba(255,255,255,0.04); color:var(--cream);}
  .dash-tab.active{background:linear-gradient(90deg, rgba(212,175,55,0.18), rgba(212,175,55,0.05)); color:var(--gold-soft); box-shadow:inset 0 0 0 1px var(--border);}
  .dash-content{flex:1; min-width:0;}
  .dash-panel{padding:26px; margin-bottom:20px;}
  .panel-title{font-size:18px; font-weight:800; margin:0 0 6px; color:var(--cream);}
  .panel-sub{font-size:13.5px; color:var(--muted); margin:0 0 20px;}

  .upload-drop{
    border:1.5px dashed var(--border);
    border-radius:var(--radius-sm);
    padding:26px;
    text-align:center;
    color:var(--muted);
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
    overflow:hidden;
  }
  .upload-drop:hover{border-color:var(--turquoise); color:var(--cream); background:rgba(46,196,182,0.05);}
  .upload-drop input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .upload-drop svg{width:30px;height:30px; margin-bottom:8px; opacity:0.7;}
  .preview-img{width:100%; max-height:280px; object-fit:cover; border-radius:var(--radius-sm); margin-top:14px; border:1px solid var(--border);}

  .stat-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
  .stat-box{
    flex:1; min-width:140px;
    background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:16px 18px;
  }
  .stat-box .num{font-size:26px; font-weight:800; color:var(--gold-soft);}
  .stat-box .lbl{font-size:12.5px; color:var(--muted); margin-top:4px;}

  .manage-post-row{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
  .manage-post-row:last-child{border-bottom:none;}
  .manage-post-row img{width:88px; height:88px; object-fit:cover; border-radius:10px; border:1px solid var(--border); flex-shrink:0;}
  .manage-post-row .mp-body{flex:1; display:flex; flex-direction:column; gap:8px;}
  .manage-post-row textarea{
    background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--cream);
    border-radius:8px; padding:8px 10px; font-size:13.5px; resize:vertical; min-height:44px;
  }
  .mp-actions{display:flex; gap:8px;}

  .swatches{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .swatch{
    width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,0.2);
    cursor:pointer; transition:transform .15s ease;
  }
  .swatch:hover{transform:scale(1.12);}
  .swatch.selected{border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.25);}
  .row-inline{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .color-input-wrap{display:flex; align-items:center; gap:10px;}
  input[type=color]{width:44px; height:44px; border:1px solid var(--border); border-radius:10px; background:none; padding:2px; cursor:pointer;}

  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; border-radius:10px; background:rgba(255,255,255,0.03);
    border:1px solid var(--border); margin-bottom:10px;
  }
  .user-phone{font-weight:700; font-size:14.5px; letter-spacing:0.5px; direction:ltr; display:inline-block;}
  .star-control{display:flex; align-items:center; gap:10px;}
  .star-count{font-weight:800; color:var(--gold-soft); min-width:26px; text-align:center; font-size:15px;}
  .circle-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:rgba(255,255,255,0.05);
    color:var(--cream); font-size:16px; display:flex; align-items:center; justify-content:center; font-weight:700;
    transition:all .15s ease;
  }
  .circle-btn:hover{border-color:var(--turquoise); color:var(--turquoise);}

  .field-row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:220px; margin-bottom:0;}
  .field-actions{display:flex; gap:8px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:linear-gradient(90deg, var(--gold), var(--gold-soft)); color:#1a2b3d;
    padding:11px 22px; border-radius:999px; font-weight:700; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:200;
    animation:toastIn .3s ease, toastOut .3s ease 1.7s forwards;
  }
  @keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
  @keyframes toastOut{to{opacity:0; transform:translate(-50%,10px);}}

  .modal-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(5,12,20,0.65);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation:toastIn .2s ease;
  }
  .modal-box{
    width:100%; max-width:340px; padding:26px;
    text-align:center;
  }
  .modal-box .modal-icon{width:34px;height:34px; color:var(--danger); margin:0 auto 12px;}
  .modal-box p{color:var(--cream); font-size:15px; margin:0 0 22px; line-height:1.8;}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions .btn{flex:1; justify-content:center;}

  @media (max-width:780px){
    .dash-layout{flex-direction:column;}
    .dash-tabs{flex-direction:row; overflow-x:auto; width:100%; position:sticky; top:76px; min-width:unset;}
    .dash-tab{white-space:nowrap;}
    .main{padding:22px 14px 70px;}
  }
</style>
</head>
<body>
<div id="site-bg-layer"></div>
<div id="starfield"></div>
<div id="app"></div>

<script>
/* ===================== decorative starfield ===================== */
(function initStarfield(){
  const layer = document.getElementById('starfield');
  const count = window.innerWidth < 640 ? 16 : 28;
  let html = '';
  for (let i=0;i<count;i++){
    const size = (Math.random()*3 + 2).toFixed(1);
    const top = (Math.random()*100).toFixed(1);
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*4).toFixed(2);
    const dur = (2.5 + Math.random()*3).toFixed(2);
    html += `<span class="bg-star" style="width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;"></span>`;
  }
  layer.innerHTML = html;
})();
</script>
<script>
/* ===================== shared cloud storage (Firebase) ===================== */
/* Uses Firebase Realtime Database's public REST API as the shared backend —
   Firebase's REST endpoints are built to be called directly from any
   browser (full CORS support), so every visitor (any device, any browser)
   reliably reads and writes the exact same data. Every write also mirrors
   to a local cache as an offline fallback so the site keeps working even
   if the network request fails for a moment. */
/* Claude bakes the project's database URL in here once the admin sends it
   over (looks like https://xxxx-default-rtdb.firebaseio.com) — after that,
   every copy of this file points at the exact same shared database. */
const BAKED_DB_URL = 'https://mani-irani-ae2f7-default-rtdb.firebaseio.com';
const FIREBASE_PATH = 'mani-irani-data';
const LOCAL_DB_URL_KEY = 'mani-irani:db-url';
const LOCAL_CACHE_KEY = 'mani-irani:shared-cache';
const LOCAL_SESSION_KEY = 'mani-irani:session';

let runtimeDbUrl = BAKED_DB_URL || null;
let firebaseDb = null;
let firebaseUrlInited = null;

function withTimeout(promise, ms, timeoutMsg){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error(timeoutMsg || 'زمان اتصال تمام شد (Timeout)')), ms))
  ]);
}

function emptySharedData(){
  return { users: [], posts: [], settings: defaultSettings() };
}
function getDbUrl(){
  if (runtimeDbUrl) return runtimeDbUrl;
  try{
    const cached = localStorage.getItem(LOCAL_DB_URL_KEY);
    if (cached){ runtimeDbUrl = cached; }
  }catch(e){ /* ignore */ }
  return runtimeDbUrl;
}
function setDbUrl(url){
  runtimeDbUrl = (url||'').trim().replace(/\/$/, '');
  try{ localStorage.setItem(LOCAL_DB_URL_KEY, runtimeDbUrl); }catch(e){ /* ignore */ }
}
async function ensureFirebase(){
  const url = getDbUrl();
  if (!url) return null;
  if (firebaseDb && firebaseUrlInited === url) return firebaseDb;
  try{
    if (typeof firebase === 'undefined'){
      state.lastSyncError = 'کتابخانه Firebase بارگذاری نشد (اتصال اینترنت را بررسی کنید)';
      return null;
    }
    if (firebase.apps && firebase.apps.length){
      await firebase.apps[0].delete();
    }
    firebase.initializeApp({ databaseURL: url });
    firebaseDb = firebase.database();
    firebaseUrlInited = url;
    return firebaseDb;
  }catch(e){
    state.lastSyncError = (e && e.message) ? e.message : String(e);
    return null;
  }
}
async function fetchSharedRemote(){
  const db = await ensureFirebase();
  if (!db) return null;
  try{
    const snap = await withTimeout(
      db.ref(FIREBASE_PATH).once('value'),
      9000,
      'اتصال به دیتابیس بیش از حد طول کشید — شبکه یا VPN را بررسی کنید'
    );
    state.lastSyncError = '';
    return snap.val() || null;
  }catch(e){
    state.lastSyncError = (e && e.message) ? e.message : String(e);
    return null;
  }
}
async function saveSharedRemote(data){
  const db = await ensureFirebase();
  if (!db) return false;
  try{
    await withTimeout(
      db.ref(FIREBASE_PATH).set(data),
      9000,
      'اتصال به دیتابیس بیش از حد طول کشید — شبکه یا VPN را بررسی کنید'
    );
    state.lastSyncError = '';
    return true;
  }catch(e){
    state.lastSyncError = (e && e.message) ? e.message : String(e);
    return false;
  }
}
function cacheSharedLocal(data){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); }catch(e){ /* ignore */ }
}
function readSharedLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function pullShared(){
  if (!getDbUrl()){ state.syncStatus = 'unconfigured'; return readSharedLocalCache() || emptySharedData(); }
  const remote = await fetchSharedRemote();
  if (remote){
    state.syncStatus = 'online';
    cacheSharedLocal(remote);
    return remote;
  }
  state.syncStatus = 'offline';
  return readSharedLocalCache() || emptySharedData();
}
async function pushShared(){
  const payload = { users: state.users, posts: state.posts, settings: state.settings };
  cacheSharedLocal(payload);
  if (!getDbUrl()){ state.syncStatus = 'unconfigured'; return false; }
  const ok = await saveSharedRemote(payload);
  state.syncStatus = ok ? 'online' : 'offline';
  return ok;
}
function getSession(){
  try{ return localStorage.getItem(LOCAL_SESSION_KEY); }catch(e){ return null; }
}
function setSession(phone){
  try{ localStorage.setItem(LOCAL_SESSION_KEY, phone||''); }catch(e){ /* ignore */ }
}

}
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ===================== load ===================== */
let realtimeRef = null;
let firstRealtimeTick = true;
async function loadAll(){
  state.syncStatus = 'connecting';
  render();
  const shared = await pullShared();
  state.users = shared.users || [];
  state.posts = shared.posts || [];
  state.settings = shared.settings || defaultSettings();

  // self-heal: admin status is always determined by the fixed admin phone number
  let changedAdmin = false;
  state.users.forEach(usr=>{
    const correct = isAdminPhone(usr.phone);
    if (usr.isAdmin !== correct){ usr.isAdmin = correct; changedAdmin = true; }
  });
  if (changedAdmin) await pushShared();

  const session = getSession();
  if (session){
    const found = state.users.find(x=>x.phone === session);
    if (found) state.currentUser = found;
  }
  state.view = state.currentUser ? (state.currentUser.isAdmin ? 'dashboard' : 'site') : 'auth';
  render();
  startRealtimeSync();
}
async function startRealtimeSync(){
  if (realtimeRef) return;
  const db = await ensureFirebase();
  if (!db) return; // stays in local/offline mode; nothing more to do
  realtimeRef = db.ref(FIREBASE_PATH);
  firstRealtimeTick = true;
  realtimeRef.on('value', (snapshot)=>{
    if (firstRealtimeTick){ firstRealtimeTick = false; return; } // we already have this from the initial load
    const data = snapshot.val();
    if (!data) return;
    state.syncStatus = 'online';
    cacheSharedLocal(data);
    const active = document.activeElement;
    const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (isTyping || state.pendingBusy) return; // don't yank focus or reset an in-progress edit
    state.users = data.users || [];
    state.posts = data.posts || [];
    state.settings = data.settings || defaultSettings();
    if (state.currentUser){
      const me = state.users.find(u=>u.phone === state.currentUser.phone);
      if (me) state.currentUser = me;
    }
    render();
  }, (error)=>{
    state.syncStatus = 'offline';
    state.lastSyncError = (error && error.message) ? error.message : String(error);
  });
}

/* ===================== auth actions ===================== */
async function handleRegister(phone, password){
  phone = (phone||'').trim();
  password = (password||'').trim();
  if (!phone || !password){ state.authError = 'شماره تلفن و رمز عبور را کامل وارد کنید.'; render(); return; }
  if (!/^[0-9+]{6,15}$/.test(phone)){ state.authError = 'شماره تلفن معتبر وارد کنید.'; render(); return; }
  if (state.users.some(u=>u.phone === phone)){ state.authError = 'این شماره قبلاً ثبت‌نام کرده. وارد شوید.'; render(); return; }
  const newUser = { phone, password, isAdmin: isAdminPhone(phone), stars: 0 };
  state.users.push(newUser);
  await pushShared();
  state.currentUser = newUser;
  setSession(phone);
  state.authError = '';
  state.view = newUser.isAdmin ? 'dashboard' : 'site';
  render();
}
async function handleLogin(phone, password){
  phone = (phone||'').trim();
  password = (password||'').trim();
  if (!phone || !password){ state.authError = 'شماره تلفن و رمز عبور را وارد کنید.'; render(); return; }
  // pull the latest shared data first, in case someone registered from another device
  const shared = await pullShared();
  state.users = shared.users || state.users;
  state.posts = shared.posts || state.posts;
  state.settings = shared.settings || state.settings;
  const found = state.users.find(u=>u.phone === phone);
  if (!found){ state.authError = 'حسابی با این شماره پیدا نشد.'; render(); return; }
  if (found.password !== password){ state.authError = 'رمز عبور اشتباه است.'; render(); return; }
  const correctAdmin = isAdminPhone(found.phone);
  if (found.isAdmin !== correctAdmin){
    found.isAdmin = correctAdmin;
    await pushShared();
  }
  state.currentUser = found;
  setSession(phone);
  state.authError = '';
  state.view = found.isAdmin ? 'dashboard' : 'site';
  render();
}
async function handleLogout(){
  state.currentUser = null;
  setSession('');
  state.view = 'auth';
  state.authMode = 'login';
  render();
}

async function addPost(caption){
  if (!state.pendingPostImage){ showToast('یک عکس انتخاب کنید'); return; }
  const post = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), image: state.pendingPostImage, caption: (caption||'').trim() };
  state.posts.unshift(post);
  await pushShared();
  state.pendingPostImage = null;
  showToast('پست منتشر شد');
}
async function deletePost(id){
  state.posts = state.posts.filter(p=>p.id !== id);
  await pushShared();
  showToast('پست حذف شد');
}
async function saveCaption(id, caption){
  const p = state.posts.find(p=>p.id === id);
  if (p){
    p.caption = caption;
    await pushShared();
    showToast('متن ذخیره شد');
  }
}

/* ===================== users / stars actions ===================== */
async function adjustStars(phone, delta){
  const u = state.users.find(u=>u.phone === phone);
  if (!u) return;
  u.stars = Math.max(0, (u.stars||0) + delta);
  await pushShared();
  if (state.currentUser && state.currentUser.phone === phone) state.currentUser = u;
  render();
}

  const bg = state.settings.background || defaultSettings().background;
  if (bg.type === 'image' && bg.value){
    layer.style.background = `url(${bg.value})`;
    layer.style.backgroundSize = 'cover';
    layer.style.backgroundPosition = 'center';
  } else {
    layer.style.background = bg.value || '#0a1826';
  }
}

function render(){
  const app = el('app');
  const scrollY = window.scrollY;
  let html = '';

  if (state.view === 'loading'){
    html = renderLoading();
  } else if (state.view === 'auth'){
    html = renderAuth();
  } else if (state.view === 'site'){
    html = renderTopbar() + renderSite();
  } else if (state.view === 'dashboard'){
    html = renderTopbar() + renderDashboard();
  }

  if (state.toast){
    html += `<div class="toast">${esc(state.toast)}</div>`;
  }

  app.innerHTML = html;
  applyBg();
  bindEvents();
  window.scrollTo(0, scrollY);
}

    ${state.pendingPostImage ? `<img src="${state.pendingPostImage}" class="preview-img">` : ''}
    <div class="field" style="margin-top:16px;">
      <label>متن زیر عکس</label>
      <textarea id="new-post-caption" rows="3" placeholder="یک توضیح برای این عکس بنویسید..."></textarea>
    </div>
    <button class="btn btn-gold" id="btn-publish-post" ${state.pendingBusy?'disabled':''}>${ICONS.upload} انتشار پست</button>
  </div>`;
}

function renderManagePostsPanel(){
  return `<div class="glass-card dash-panel">
    <div class="panel-title">مدیریت پست‌ها</div>
    <p class="panel-sub">متن پست‌ها را ویرایش یا آن‌ها را حذف کنید.</p>
    ${state.posts.length === 0 ? `<div class="empty-state">${ICONS.image}<div>هنوز پستی ثبت نشده</div></div>` : state.posts.map(p=>`
      <div class="manage-post-row" data-post-id="${p.id}">
        <img src="${p.image}">
        <div class="mp-body">
          <textarea data-caption-for="${p.id}" rows="2">${esc(p.caption)}</textarea>
          <div class="mp-actions">
            <button class="btn btn-sm btn-ghost" data-save-caption="${p.id}">ذخیره متن</button>
            <button class="btn btn-sm btn-danger" data-delete-post="${p.id}">${ICONS.trash} حذف پست</button>
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderBackgroundPanel(){
  const bg = state.settings.background || defaultSettings().background;
  return `<div class="glass-card dash-panel">
    <div class="panel-title">پس‌زمینه سایت</div>
    <p class="panel-sub">یک رنگ انتخاب کنید یا یک تصویر برای پس‌زمینه سایت آپلود کنید.</p>
    <div class="swatches">
      ${PRESET_COLORS.map(c=>`<div class="swatch ${bg.type==='color'&&bg.value===c?'selected':''}" style="background:${c}" data-color="${c}"></div>`).join('')}
    </div>
    <div class="row-inline" style="margin-bottom:20px;">
      <div class="color-input-wrap">
        <input type="color" id="bg-color-picker" value="${bg.type==='color'?bg.value:'#0a1826'}">
        <span style="color:var(--muted); font-size:13.5px;">رنگ دلخواه</span>
      </div>
    </div>
    <label class="upload-drop">
      ${ICONS.upload}
      <div>آپلود عکس برای پس‌زمینه</div>
      <input type="file" accept="image/*" id="bg-image-file">
    </label>
    ${bg.type==='image' ? `
      <img src="${bg.value}" class="preview-img">
      <button class="btn btn-sm btn-danger" id="btn-remove-bg-image" style="margin-top:10px;">${ICONS.trash} حذف عکس پس‌زمینه</button>
    ` : ''}
  </div>`;
}

function renderChannelPanel(){
  const s = state.settings;
  return `<div class="glass-card dash-panel">
    <div class="panel-title">لینک و متن کانال</div>
    <p class="panel-sub">این متن و لینک بالای سایت برای همه کاربران نمایش داده می‌شود.</p>
    <div class="field">
      <label>لینک کانال</label>
      <div class="field-row">
        <input type="text" id="channel-link-input" placeholder="https://t.me/..." dir="ltr" style="text-align:left" value="${esc(s.channelLink)}">
        <div class="field-actions">
          <button class="btn btn-sm btn-ghost" id="btn-save-link">ذخیره</button>
          <button class="btn btn-sm btn-danger" id="btn-clear-link">${ICONS.trash} حذف</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>متن کانال</label>
      <div class="field-row">
        <textarea id="channel-text-input" rows="2" placeholder="متن دلخواه...">${esc(s.channelText)}</textarea>
        <div class="field-actions">
          <button class="btn btn-sm btn-ghost" id="btn-save-text">ذخیره</button>
          <button class="btn btn-sm btn-danger" id="btn-clear-text">${ICONS.trash} حذف</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderUsersPanel(){
  const nonAdmins = state.users.filter(u=>!u.isAdmin);
  return `<div class="glass-card dash-panel">
    <div class="panel-title">کاربران و ستاره‌ها</div>
    <p class="panel-sub">تعداد ستاره هر کاربر را کم یا زیاد کنید.</p>
    <div class="stat-row">
      <div class="stat-box"><div class="num">${state.users.length}</div><div class="lbl">مجموع کاربران</div></div>
      <div class="stat-box"><div class="num">${nonAdmins.length}</div><div class="lbl">کاربران عادی</div></div>
      <div class="stat-box"><div class="num">${state.posts.length}</div><div class="lbl">تعداد پست‌ها</div></div>
    </div>
    ${nonAdmins.length === 0 ? `<div class="empty-state">${ICONS.users}<div>هنوز کاربری ثبت‌نام نکرده</div></div>` : nonAdmins.map(u=>`
      <div class="user-row">
        <span class="user-phone">${ICONS.phone} ${esc(u.phone)}</span>
        <div class="star-control">
          <button class="circle-btn" data-star-minus="${u.phone}">−</button>
          <span class="star-count">${u.stars||0}</span>
          <button class="circle-btn" data-star-plus="${u.phone}">+</button>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderSyncPanel(){
  const baked = !!BAKED_DB_URL;
  const currentUrl = getDbUrl() || '';
  const statusText = state.syncStatus === 'online' ? 'متصل — همه کاربران این محتوا را می‌بینند'
    : state.syncStatus === 'offline' ? 'قطع — پیام سرور نیومد، فعلاً فقط روی همین دستگاه ذخیره می‌شود'
    : state.syncStatus === 'unconfigured' ? 'هنوز آدرس دیتابیس مشترک ثبت نشده'
    : 'در حال اتصال...';
  return `<div class="glass-card dash-panel">
    <div class="panel-title">همگام‌سازی و اشتراک‌گذاری</div>
    <p class="panel-sub">${syncBadge()} &nbsp;${statusText}</p>
    ${state.lastSyncError ? `
      <div style="background:rgba(224,104,95,0.1); border:1px solid rgba(224,104,95,0.35); border-radius:10px; padding:12px 14px; margin-bottom:16px;">
        <div style="color:#f4a49d; font-size:13px; font-weight:700; margin-bottom:4px;">پیام خطای دقیق:</div>
        <div style="color:#f4a49d; font-size:13px; direction:ltr; text-align:left; font-family:monospace; word-break:break-word;">${esc(state.lastSyncError)}</div>
      </div>
    ` : ''}
    ${baked ? `
      <p style="color:var(--muted); font-size:13.5px; line-height:1.9;">این نسخه از سایت از قبل به پایگاه‌داده‌ی مشترک وصل شده. نیازی به کار دیگری نیست — هر پستی بگذارید همه می‌بینند.</p>
    ` : `
      <p style="color:var(--muted); font-size:13.5px; line-height:1.9;">
        یک پایگاه‌داده‌ی رایگان Firebase بسازید (طبق راهنمایی که Claude داده) و آدرس آن را اینجا وارد کنید — چیزی شبیه <span dir="ltr" style="color:var(--gold-soft);">https://xxxx-default-rtdb.firebaseio.com</span>. بعد همون آدرس رو برای Claude هم بفرستید تا داخل نسخه‌ی نهایی فایل ثابتش کنه؛ اون‌وقت هرکی این فایل رو دانلود کنه، به همین یک پایگاه‌داده وصل می‌شه.
      </p>
      <div class="field-row" style="margin-top:14px;">
        <input type="text" value="${esc(currentUrl)}" id="db-url-input" dir="ltr" style="text-align:left;" placeholder="https://xxxx-default-rtdb.firebaseio.com">
        <div class="field-actions">
          <button class="btn btn-sm btn-gold" id="btn-save-db-url">اتصال</button>
        </div>
      </div>
    `}
  </div>`;
}

/* ===================== events ===================== */
function bindEvents(){
  // auth
  const tabLogin = el('tab-login'); const tabRegister = el('tab-register');
  if (tabLogin) tabLogin.onclick = ()=>{ state.authMode='login'; state.authError=''; render(); };
  if (tabRegister) tabRegister.onclick = ()=>{ state.authMode='register'; state.authError=''; render(); };
  const authForm = el('auth-form');
  if (authForm) authForm.onsubmit = (e)=>{
    e.preventDefault();
    const phone = el('auth-phone').value;
    const password = el('auth-password').value;
    if (state.authMode === 'login') handleLogin(phone, password);
    else handleRegister(phone, password);
  };
  const togglePw = el('toggle-password');
  if (togglePw) togglePw.onclick = ()=>{
    const pwInput = el('auth-password');
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    togglePw.innerHTML = isHidden ? ICONS.eyeOff : ICONS.eye;
  };

  // topbar
  const btnLogout = el('btn-logout'); if (btnLogout) btnLogout.onclick = handleLogout;
  const btnGotoDash = el('btn-goto-dashboard'); if (btnGotoDash) btnGotoDash.onclick = ()=>{ state.view='dashboard'; render(); };
  const btnGotoSite = el('btn-goto-site'); if (btnGotoSite) btnGotoSite.onclick = ()=>{ state.view='site'; render(); };

  // dashboard tabs
  document.querySelectorAll('.dash-tab').forEach(btn=>{
    btn.onclick = ()=>{ state.dashboardTab = btn.getAttribute('data-tab'); state.pendingPostImage=null; render(); };
  });

  // add post
  const newPostFile = el('new-post-file');
  if (newPostFile) newPostFile.onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    state.pendingBusy = true;
    try{
      state.pendingPostImage = await compressImage(file, 1000, 0.78);
    }catch(err){ showToast('خطا در بارگذاری عکس'); }
    state.pendingBusy = false;
    render();
  };
  const btnPublish = el('btn-publish-post');
  if (btnPublish) btnPublish.onclick = async ()=>{
    const caption = el('new-post-caption') ? el('new-post-caption').value : '';
    btnPublish.disabled = true;
    await addPost(caption);
    render();
  };

  // manage posts
  document.querySelectorAll('[data-save-caption]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-save-caption');
      const ta = document.querySelector(`[data-caption-for="${id}"]`);
      await saveCaption(id, ta ? ta.value : '');
    };
  });
  document.querySelectorAll('[data-delete-post]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-delete-post');
      showConfirm('این پست برای همیشه حذف می‌شود. مطمئنید؟', async ()=>{
        await deletePost(id);
        render();
      });
    };
  });

  // background
  document.querySelectorAll('.swatch').forEach(sw=>{
    sw.onclick = ()=> updateSettings({ background:{ type:'color', value: sw.getAttribute('data-color') } });
  });
  const bgColorPicker = el('bg-color-picker');
  if (bgColorPicker) bgColorPicker.onchange = (e)=> updateSettings({ background:{ type:'color', value: e.target.value } });
  const bgImageFile = el('bg-image-file');
  if (bgImageFile) bgImageFile.onchange = async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    try{
      const dataUrl = await compressImage(file, 1600, 0.72);
      await updateSettings({ background:{ type:'image', value:dataUrl } });
    }catch(err){ showToast('خطا در بارگذاری عکس'); }
  };
  const btnRemoveBg = el('btn-remove-bg-image');
  if (btnRemoveBg) btnRemoveBg.onclick = ()=> updateSettings({ background:{ type:'color', value:'#0a1826' } });

  // channel
  const btnSaveLink = el('btn-save-link');
  if (btnSaveLink) btnSaveLink.onclick = async ()=>{ await updateSettings({ channelLink: el('channel-link-input').value.trim() }); showToast('لینک ذخیره شد'); };
  const btnClearLink = el('btn-clear-link');
  if (btnClearLink) btnClearLink.onclick = async ()=>{ await updateSettings({ channelLink:'' }); showToast('لینک حذف شد'); };
  const btnSaveText = el('btn-save-text');
  if (btnSaveText) btnSaveText.onclick = async ()=>{ await updateSettings({ channelText: el('channel-text-input').value.trim() }); showToast('متن ذخیره شد'); };
  const btnClearText = el('btn-clear-text');
  if (btnClearText) btnClearText.onclick = async ()=>{ await updateSettings({ channelText:'' }); showToast('متن حذف شد'); };

  // users / stars
  document.querySelectorAll('[data-star-plus]').forEach(btn=>{
    btn.onclick = ()=> adjustStars(btn.getAttribute('data-star-plus'), 1);
  });
  document.querySelectorAll('[data-star-minus]').forEach(btn=>{
    btn.onclick = ()=> adjustStars(btn.getAttribute('data-star-minus'), -1);
  });

  // sync
  const btnSaveDbUrl = el('btn-save-db-url');
  if (btnSaveDbUrl) btnSaveDbUrl.onclick = async ()=>{
    const input = el('db-url-input');
    const url = (input.value || '').trim();
    if (!/^https:\/\/.+firebaseio\.com/i.test(url)){
      showToast('آدرس دیتابیس معتبر نیست');
      return;
    }
    setDbUrl(url);
    state.syncStatus = 'connecting';
    render();
    const shared = await pullShared();
    state.users = shared.users || [];
    state.posts = shared.posts || [];
    state.settings = shared.settings || defaultSettings();
    if ((shared.users||[]).length === 0 && (shared.posts||[]).length === 0){
      // brand-new empty database — seed it with whatever we already have locally
      await pushShared();
    }
    showToast(state.syncStatus === 'online' ? 'با موفقیت وصل شد' : 'اتصال برقرار نشد، آدرس را بررسی کنید');
    render();
  };
}

/* ===================== boot ===================== */
loadAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
